[project]
name = "hello-world"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "David", email = "frieldavid3@icloud.com" }
]
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "requests==2.31.0",
]

[project.scripts]
hello-world = "hello_world:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
requests = { git = "https://github.com/psf/requests" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
